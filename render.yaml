# BIRD ACADEMY ENTERPRISE — PUBLIC TEST DEPLOYMENT BLUEPRINT (RENDER.COM)
# Free Tier (0 € / month) Web Service Deployment Configuration
# Provides native HTTPS, automated CI/CD from GitHub, and isolated server environment.

services:
  - type: web
    name: bird-academy-public-test
    env: node
    plan: free
    region: frankfurt # or oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run serve:test
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: TEST
      - key: PORT
        value: 10000
      - key: VITE_LMSE_ENV
        value: production
      # Server-side secrets (Configured in Render dashboard, NEVER in repository)
      - key: LMSE_PRIVATE_SIGNING_KEY
        sync: false
      - key: LMSE_SEED_SECRET
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
