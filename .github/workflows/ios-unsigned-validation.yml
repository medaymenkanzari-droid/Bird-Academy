name: iOS Unsigned Build Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ios-build:
    name: Validate iOS Compilation (Unsigned)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application Bundle
        run: npm run build:user:beta

      - name: Sync Capacitor iOS Assets & Plugins
        run: npx cap sync ios

      - name: Inspect Xcode Project & Schemes
        run: |
          xcodebuild -project ios/App/App.xcodeproj -list

      - name: Resolve Swift Package Manager Dependencies
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies

      - name: Compile iOS Native Target (Unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
