version: '3.8'

services:
  lmse-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bird-academy-lmse-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - VITE_APP_MODE=admin
      - LMSE_PRIVATE_SIGNING_KEY=${LMSE_PRIVATE_SIGNING_KEY:-LMSE_SERVER_SECURE_KEY_LOCAL_DEV}
      - VITE_LMSE_API_URL=${VITE_LMSE_API_URL:-http://localhost:3001}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - lmse-data:/app/data

volumes:
  lmse-data:
    driver: local
